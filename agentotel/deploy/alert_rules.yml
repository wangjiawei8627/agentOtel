# AgentOTel Prometheus 告警规则
# 接入方式：prometheus.yml 中 rule_files 指向本文件（见 prometheus.yml）
# 阈值可按业务调整；for 字段用于抑制瞬时抖动。
groups:
  - name: agentotel-availability
    interval: 30s
    rules:
      # 1) Agent 成功率跌破 90%（持续 5 分钟）
      - alert: AgentSuccessRateLow
        expr: |
          sum(rate(agentotel_agent_calls_total{status="ok"}[5m]))
            / clamp_min(sum(rate(agentotel_agent_calls_total[5m])), 1e-9) < 0.90
        for: 5m
        labels:
          severity: critical
          category: agent
        annotations:
          summary: "Agent 成功率跌破 90%"
          description: "近 5 分钟 Agent 成功率为 {{ $value | humanizePercentage }}，低于 90% 阈值。"
          runbook: "查看 Grafana AgentOTel Overview 概览与工具调用区块。"

      # 2) Agent 错误请求速率突增（每分钟 > 6 个错误）
      - alert: AgentErrorBurst
        expr: sum(rate(agentotel_agent_calls_total{status="error"}[5m])) * 60 > 6
        for: 3m
        labels:
          severity: warning
          category: agent
        annotations:
          summary: "Agent 错误请求突增"
          description: "近 5 分钟平均每分钟错误数约 {{ $value | humanize }}。"

  - name: agentotel-latency
    interval: 30s
    rules:
      # 3) LLM 耗时 P95 超过 3 秒
      - alert: LLMP95LatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum by (le)(rate(agentotel_llm_duration_ms_bucket[5m]))) > 3000
        for: 5m
        labels:
          severity: warning
          category: llm
        annotations:
          summary: "LLM P95 耗时超过 3s"
          description: "当前 LLM P95 耗时约 {{ $value | humanize }}ms。"

      # 4) 工具耗时 P95 超过 5 秒（按工具维度）
      - alert: ToolP95LatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum by (le, tool)(rate(agentotel_tool_duration_ms_bucket[5m]))) > 5000
        for: 5m
        labels:
          severity: warning
          category: tool
        annotations:
          summary: "工具 {{ $labels.tool }} P95 耗时超过 5s"
          description: "工具 {{ $labels.tool }} 当前 P95 耗时约 {{ $value | humanize }}ms。"

  - name: agentotel-tool
    interval: 30s
    rules:
      # 5) 工具失败率超过 10%（持续 5 分钟）
      - alert: ToolFailureRateHigh
        expr: |
          sum(rate(agentotel_tool_calls_total{status="error"}[5m]))
            / clamp_min(sum(rate(agentotel_tool_calls_total[5m])), 1e-9) > 0.10
        for: 5m
        labels:
          severity: critical
          category: tool
        annotations:
          summary: "工具失败率超过 10%"
          description: "近 5 分钟工具失败率为 {{ $value | humanizePercentage }}。"

  - name: agentotel-cost
    interval: 30s
    rules:
      # 6) Token 消耗暴涨：当前速率 > 3 倍 1 小时基线
      - alert: TokenUsageSpike
        expr: |
          sum(rate(agentotel_llm_tokens_total[5m]))
            > 3 * avg_over_time((sum(rate(agentotel_llm_tokens_total[5m])))[1h:5m])
        for: 10m
        labels:
          severity: warning
          category: cost
        annotations:
          summary: "Token 消耗异常暴涨"
          description: "当前 Token 速率超过 1 小时基线的 3 倍，可能存在死循环或调用量异常。"
          runbook: "检查是否有 Agent 循环次数异常、工具重试风暴。"

      # 7) 5 分钟内输入 token 累计超过 100 万（成本护栏，可按业务调整）
      - alert: TokenBudgetGuard
        expr: sum(increase(agentotel_llm_tokens_total[5m])) > 1000000
        for: 1m
        labels:
          severity: warning
          category: cost
        annotations:
          summary: "5 分钟 Token 消耗超过 100 万"
          description: "近 5 分钟累计 token 约 {{ $value | humanize }}，触发成本护栏。"
